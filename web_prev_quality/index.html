<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#031c25">
  <title>深蓝漫游 · 原生 WebGL2 深海</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23052c35%27/%3E%3Cpath d=%27M5 18c6-9 13-9 20-3-6 0-8 7-13 7-3 0-5-2-7-4z%27 fill=%27%239cf7df%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css?v=401">
</head>
<body>
  <canvas id="gl" aria-label="可交互的深海三维场景"></canvas>
  <div class="grain"></div>

  <header class="brand hud-panel">
    <div class="eyebrow"><span class="live-dot"></span> ABYSSAL DRIFT <span class="edition">EXPEDITION 01</span></div>
    <h1>深蓝漫游</h1>
    <p>潜入光与生命之间</p>
  </header>

  <aside class="telemetry hud-panel">
    <div class="telemetry-head"><span>生态系统</span><span class="live">LIVE</span></div>
    <div class="metric"><span>深度</span><strong id="depth">17.0 <small>M</small></strong></div>
    <div class="depth-line"><i id="depthLine"></i></div>
    <div class="metric compact"><span>能见度</span><b>38 M</b></div>
    <div class="metric compact"><span>生物个体</span><b>352</b></div>
  </aside>

  <div class="performance hud-panel">
    <span class="perf-icon"></span><strong id="fps">-- FPS</strong><i></i><span id="quality">自动 · 高</span><i></i><span id="resolution">--</span>
  </div>

  <div class="species hud-panel">
    <span>01</span><div><b>太平洋豚群</b><small>跟随领航者，驶入蔚蓝</small></div>
  </div>

  <nav class="controls hud-panel" aria-label="场景控制">
    <button id="pause" class="primary" title="空格键"><span class="pause-icon">Ⅱ</span><span id="pauseText">暂停漫游</span></button>
    <span class="divider"></span>
    <button id="reset" title="R 键">视角重置</button>
    <button id="qualityBtn" title="切换画质">画质：自动</button>
    <div class="speed"><label for="speed">航速</label><input id="speed" type="range" min="0.35" max="2" value="1" step="0.05"><output id="speedValue">1.00×</output></div>
    <button id="capture" class="icon-btn" title="保存当前画面" aria-label="截图">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l1.4-2h5.2L16 5h3a2 2 0 012 2v11a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h3zm4 12a4.5 4.5 0 100-9 4.5 4.5 0 000 9zm0-2a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"/></svg>
    </button>
  </nav>

  <div class="help"><span>拖拽</span> 环视 <i>·</i> <span>滚轮</span> 调速 <i>·</i> <span>空格</span> 暂停 <i>·</i> <span>R</span> 重置 <i>·</i> <span>H</span> 隐藏界面</div>
  <div id="toast" role="status"></div>
  <div id="loading"><div class="loader-ring"></div><span>正在潜入深蓝</span><small>GENERATING OCEAN</small></div>
  <div id="fatal"></div>

  <script src="js/mat4.js?v=401"></script>
  <script src="js/noise.js?v=401"></script>
  <script src="js/geometry.js?v=401"></script>
  <script src="js/shaders.js?v=401"></script>
  <script src="js/renderer.js?v=401"></script>
  <script src="js/scene.js?v=401"></script>
  <script src="js/main.js?v=401"></script>
</body>
</html>
